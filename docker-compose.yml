services:
  postgres:
    image: postgres:17-alpine
    container_name: biranchi-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: biranchi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biranchi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
